<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Fire Escape</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; color: white; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; text-shadow: 2px 2px 4px #000; }
        #gameOver { display: none; color: #ff4500; font-size: 3em; font-weight: bold; margin-top: 20px; }
        h2 { margin: 0 0 5px 0; color: #ffaa00; }
        .instructions { font-size: 0.9em; margin: 5px 0; color: #ddd; }
        #powerupText { color: #00ffff; font-weight: bold; display: none; font-size: 1.5em; margin-top: 10px; }
        h3 { margin: 5px 0; }
    </style>
</head>
<body>
    <div id="ui">
        <h2>3D Fire Escape</h2>
        <p class="instructions"><b>Left / Right (A/D)</b> to dodge. <b>Space / Up (W)</b> to jump.</p>
        <p class="instructions">Grab <b>Gold Rings</b> for points. <b>Blue Crystals</b> are power-ups!</p>
        <h3 id="score">Score: 0</h3>
        <h3 id="powerupsUI">Power-ups: 0 <span style="font-size:0.6em">(Press Shift to Use)</span></h3>
        <div id="powerupText">FIRE PUSHED BACK!</div>
        <div id="gameOver">GAME OVER!<br><span style="font-size: 0.5em; color: white;">Press R to Restart</span></div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scoreElement = document.getElementById('score');
        const powerupsUIElement = document.getElementById('powerupsUI');
        const gameOverElement = document.getElementById('gameOver');
        const powerupTextElement = document.getElementById('powerupText');

        let scene, camera, renderer;
        let player, fireWall, floor;
        let obstacles = [];
        let coins = [];
        let powerups = [];
        
        let score = 0;
        let baseScore = 0; // Score from distance
        let bonusScore = 0; // Score from coins
        let powerupCount = 0; // Inventory
        let isGameOver = false;
        
        // Speeds
        const BASE_SPEED = 0.4;
        let playerSpeed = BASE_SPEED;
        let fireSpeed = BASE_SPEED; 
        
        // Jumping Physics
        let playerVelocityY = 0;
        let isJumping = false;
        const GRAVITY = -0.015;
        const JUMP_FORCE = 0.35;
        
        let keys = { left: false, right: false };

        function updateUI() {
            scoreElement.innerText = `Score: ${score}`;
            powerupsUIElement.innerHTML = `Power-ups: ${powerupCount} <span style="font-size:0.6em">(Press Shift to Use)</span>`;
        }

        // Helper to create a better player model
        function createPlayerModel() {
            let group = new THREE.Group();
            
            // Head
            let headGeo = new THREE.SphereGeometry(0.4, 16, 16);
            let headMat = new THREE.MeshLambertMaterial({color: 0xffccaa});
            let head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 0.8;
            group.add(head);

            // Hair Material
            let hairMat = new THREE.MeshLambertMaterial({color: 0x4a2e15}); // Dark brown hair
            
            // Hair (Top)
            let hairTopGeo = new THREE.BoxGeometry(0.85, 0.35, 0.85);
            let hairTop = new THREE.Mesh(hairTopGeo, hairMat);
            hairTop.position.y = 1.1; 
            group.add(hairTop);

            // Hair (Bangs/Front)
            let hairFrontGeo = new THREE.BoxGeometry(0.85, 0.2, 0.3);
            let hairFront = new THREE.Mesh(hairFrontGeo, hairMat);
            hairFront.position.set(0, 0.95, -0.35); 
            group.add(hairFront);
            
            // Hair (Back)
            let hairBackGeo = new THREE.BoxGeometry(0.85, 0.4, 0.3);
            let hairBack = new THREE.Mesh(hairBackGeo, hairMat);
            hairBack.position.set(0, 0.9, 0.35); 
            group.add(hairBack);
            
            // Body
            let bodyGeo = new THREE.BoxGeometry(0.6, 0.8, 0.4);
            let bodyMat = new THREE.MeshLambertMaterial({color: 0x4169e1}); // Blue shirt
            let body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.1;
            group.add(body);
            
            // Cape (flutters in wind)
            let capeGeo = new THREE.PlaneGeometry(0.5, 0.8);
            let capeMat = new THREE.MeshBasicMaterial({color: 0xff0000, side: THREE.DoubleSide});
            let cape = new THREE.Mesh(capeGeo, capeMat);
            cape.position.set(0, 0.2, 0.25);
            cape.rotation.x = -0.3;
            cape.name = "cape";
            group.add(cape);
            
            group.position.y = 0.5; // Default ground level
            return group;
        }

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x221111, 20, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x221111);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x606060); 
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(0, 20, 10);
            scene.add(directionalLight);
            
            // Fire Light
            const fireLight = new THREE.PointLight(0xff4500, 2, 50);
            fireLight.name = "fireLight";
            scene.add(fireLight);

            // Grid Floor for better 3D perspective
            const floorGeo = new THREE.PlaneGeometry(30, 10000);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            
            const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x444444);
            gridHelper.position.y = 0.01; // Slightly above floor
            scene.add(gridHelper);

            // Player
            player = createPlayerModel();
            scene.add(player);

            // Fire Wall
            const fireGeo = new THREE.BoxGeometry(30, 10, 5);
            const fireMat = new THREE.MeshBasicMaterial({ color: 0xff4500 });
            fireWall = new THREE.Mesh(fireGeo, fireMat);
            
            const fireWireframe = new THREE.Mesh(fireGeo, new THREE.MeshBasicMaterial({color: 0xffff00, wireframe: true}));
            fireWall.add(fireWireframe);
            
            fireWall.position.set(0, 5, 15);
            scene.add(fireWall);
            
            fireLight.position.copy(fireWall.position);

            // Initial spawns
            for(let i=0; i<20; i++) {
                spawnEntity(-20 - i*15);
            }

            window.addEventListener('resize', onWindowResize, false);
            updateUI();
        }

        function clearEntities(arr) {
            for(let ent of arr) {
                scene.remove(ent);
            }
            arr.length = 0;
        }

        function resetGame() {
            player.position.set(0, 0.5, 0);
            fireWall.position.set(0, 5, 15);
            playerVelocityY = 0;
            isJumping = false;
            
            clearEntities(obstacles);
            clearEntities(coins);
            clearEntities(powerups);
            
            for(let i=0; i<20; i++) {
                spawnEntity(-20 - i*15);
            }
            
            baseScore = 0;
            bonusScore = 0;
            score = 0;
            powerupCount = 0;
            isGameOver = false;
            playerSpeed = BASE_SPEED;
            gameOverElement.style.display = 'none';
            updateUI();
        }

        function spawnEntity(zPos) {
            const rand = Math.random();
            const xPos = (Math.random() - 0.5) * 20;

            if (rand < 0.7) {
                // Obstacle (Boxes)
                const size = 1 + Math.random();
                const geo = new THREE.BoxGeometry(size, size, size);
                const mat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
                const obs = new THREE.Mesh(geo, mat);
                obs.position.set(xPos, size/2, zPos);
                scene.add(obs);
                obstacles.push(obs);
            } else if (rand < 0.95) {
                // Coin (Golden Ring)
                const geo = new THREE.TorusGeometry(0.5, 0.15, 8, 16);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1, roughness: 0.2 });
                const coin = new THREE.Mesh(geo, mat);
                coin.position.set(xPos, 1, zPos);
                scene.add(coin);
                coins.push(coin);
            } else {
                // Powerup (Blue Crystal)
                const geo = new THREE.IcosahedronGeometry(0.5);
                const mat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x005555 });
                const pu = new THREE.Mesh(geo, mat);
                pu.position.set(xPos, 1, zPos);
                scene.add(pu);
                powerups.push(pu);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function showPowerupText() {
            powerupTextElement.style.display = 'block';
            setTimeout(() => {
                powerupTextElement.style.display = 'none';
            }, 1500);
        }

        // Input handling
        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
            
            // Jump
            if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') && !isJumping && !isGameOver) {
                playerVelocityY = JUMP_FORCE;
                isJumping = true;
            }
            
            // Use Powerup
            if (e.key === 'Shift' && powerupCount > 0 && !isGameOver) {
                powerupCount--;
                fireWall.position.z += 20; 
                showPowerupText();
                updateUI();
            }

            if ((e.key === 'r' || e.key === 'R') && isGameOver) resetGame();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
        });

        function animate() {
            requestAnimationFrame(animate);

            if (isGameOver) {
                renderer.render(scene, camera);
                return;
            }

            // --- Movement & Physics ---
            player.position.z -= playerSpeed;
            playerSpeed += 0.0001; // Accelerate over time
            fireSpeed = playerSpeed;

            // Lateral Movement
            if (keys.left) player.position.x -= 0.3;
            if (keys.right) player.position.x += 0.3;
            player.position.x = Math.max(-14, Math.min(14, player.position.x));

            // Jumping Physics
            playerVelocityY += GRAVITY;
            player.position.y += playerVelocityY;
            
            if (player.position.y <= 0.5) {
                player.position.y = 0.5;
                playerVelocityY = 0;
                isJumping = false;
            }

            // Animate Cape
            const cape = player.getObjectByName("cape");
            if (cape) cape.rotation.x = -0.3 + Math.sin(Date.now() * 0.02) * 0.2;

            // Move Fire
            fireWall.position.z -= fireSpeed;
            scene.getObjectByName("fireLight").position.z = fireWall.position.z - 3;
            
            // Wobble Fire Wall
            fireWall.scale.y = 1 + Math.sin(Date.now() * 0.01) * 0.1;
            fireWall.scale.x = 1 + Math.cos(Date.now() * 0.01) * 0.05;

            // Camera Tracking
            camera.position.x = player.position.x * 0.5;
            camera.position.y = 4 + (player.position.y - 0.5) * 0.5; // Slight up/down tracking
            camera.position.z = player.position.z + 8;
            camera.lookAt(player.position.x, 1, player.position.z - 10);
            
            // Move Grid Helper to simulate endless floor
            scene.children.forEach(c => {
                if(c.type === "GridHelper") {
                    c.position.z = player.position.z;
                }
            });

            // --- Collision Detection ---
            const playerBox = new THREE.Box3().setFromObject(player);
            playerBox.expandByScalar(-0.15); // Forgiveness buffer

            // 1. Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                let obsBox = new THREE.Box3().setFromObject(obs);
                
                if (playerBox.intersectsBox(obsBox)) {
                    // Hit obstacle! Instant game over
                    isGameOver = true;
                    gameOverElement.style.display = 'block';
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                } else if (obs.position.z > fireWall.position.z) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // 2. Coins
            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                coin.rotation.y += 0.05; // Spin animation
                let coinBox = new THREE.Box3().setFromObject(coin);
                
                if (playerBox.intersectsBox(coinBox)) {
                    bonusScore += 50;
                    scene.remove(coin);
                    coins.splice(i, 1);
                } else if (coin.position.z > fireWall.position.z) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }

            // 3. Powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                let pu = powerups[i];
                pu.rotation.x += 0.05;
                pu.rotation.y += 0.05;
                let puBox = new THREE.Box3().setFromObject(pu);
                
                if (playerBox.intersectsBox(puBox)) {
                    // Pick up powerup
                    powerupCount++;
                    scene.remove(pu);
                    powerups.splice(i, 1);
                } else if (pu.position.z > fireWall.position.z) {
                    scene.remove(pu);
                    powerups.splice(i, 1);
                }
            }

            // --- Entity Spawning ---
            let furthestZ = player.position.z;
            const allEntities = [...obstacles, ...coins, ...powerups];
            if (allEntities.length > 0) {
                allEntities.forEach(e => {
                    if (e.position.z < furthestZ) furthestZ = e.position.z;
                });
            }

            if (furthestZ > player.position.z - 200) {
                spawnEntity(furthestZ - (10 + Math.random() * 15));
            }

            // --- Game Over Check ---
            if (fireWall.position.z - 2.5 <= player.position.z) {
                isGameOver = true;
                gameOverElement.style.display = 'block';
            }

            // --- Scoring ---
            baseScore = Math.floor(-player.position.z);
            score = baseScore + bonusScore;
            updateUI();

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
