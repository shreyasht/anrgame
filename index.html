<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Fire Escape</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; color: white; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; text-shadow: 2px 2px 4px #000; }
        #gameOver { display: none; color: #ff4500; font-size: 3em; font-weight: bold; margin-top: 20px; }
        h2 { margin: 0 0 10px 0; color: #ffaa00; }
    </style>
</head>
<body>
    <div id="ui">
        <h2>3D Fire Escape</h2>
        <p>Use <b>Left / Right Arrows</b> or <b>A / D</b> to dodge obstacles.</p>
        <p>Hitting an obstacle slows you down. Don't let the fire wall catch you!</p>
        <h3 id="score">Score: 0</h3>
        <div id="gameOver">GAME OVER!<br><span style="font-size: 0.5em; color: white;">Press R to Restart</span></div>
    </div>
    
    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');

        let scene, camera, renderer;
        let player, fireWall, floor;
        let obstacles = [];
        
        let score = 0;
        let isGameOver = false;
        
        // Speeds
        const BASE_SPEED = 0.4;
        let playerSpeed = BASE_SPEED;
        let fireSpeed = BASE_SPEED; 
        
        let keys = { left: false, right: false };

        function init() {
            // Setup scene
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x221111, 20, 100);

            // Setup camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Setup renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x221111);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040); // soft white light
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(0, 20, 10);
            scene.add(directionalLight);
            
            // Fire Light
            const fireLight = new THREE.PointLight(0xff4500, 2, 50);
            scene.add(fireLight);

            // Floor
            const floorGeo = new THREE.PlaneGeometry(30, 10000);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            scene.add(floor);

            // Player (Blue Boy)
            const playerGeo = new THREE.BoxGeometry(1, 1, 1);
            const playerMat = new THREE.MeshLambertMaterial({ color: 0x4169e1 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 0.5, 0);
            scene.add(player);

            // Fire Wall (Behind player)
            const fireGeo = new THREE.BoxGeometry(30, 10, 5);
            const fireMat = new THREE.MeshBasicMaterial({ color: 0xff4500 });
            fireWall = new THREE.Mesh(fireGeo, fireMat);
            fireWall.position.set(0, 5, 15); // Starts 15 units behind
            scene.add(fireWall);
            
            fireLight.position.copy(fireWall.position);

            // Initial obstacles
            for(let i=0; i<20; i++) {
                spawnObstacle(-20 - i*10);
            }

            // Window resize handler
            window.addEventListener('resize', onWindowResize, false);
        }

        function resetGame() {
            player.position.set(0, 0.5, 0);
            fireWall.position.set(0, 5, 15);
            
            // Clear obstacles
            for(let obs of obstacles) {
                scene.remove(obs);
            }
            obstacles = [];
            
            for(let i=0; i<20; i++) {
                spawnObstacle(-20 - i*10);
            }
            
            score = 0;
            isGameOver = false;
            playerSpeed = BASE_SPEED;
            gameOverElement.style.display = 'none';
        }

        function spawnObstacle(zPos) {
            const size = 1 + Math.random() * 2;
            const geo = new THREE.BoxGeometry(size, size, size);
            const mat = new THREE.MeshLambertMaterial({ color: 0x888888 });
            const obs = new THREE.Mesh(geo, mat);
            // Random X between -10 and 10
            obs.position.set((Math.random() - 0.5) * 20, size/2, zPos);
            scene.add(obs);
            obstacles.push(obs);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Input handling
        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
            if ((e.key === 'r' || e.key === 'R') && isGameOver) resetGame();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
        });

        function animate() {
            requestAnimationFrame(animate);

            if (isGameOver) {
                renderer.render(scene, camera);
                return;
            }

            // Move player forward (-Z direction)
            player.position.z -= playerSpeed;
            
            // Speed slowly increases
            playerSpeed += 0.0001;
            fireSpeed = playerSpeed; // Fire keeps pace

            // Move fire wall
            fireWall.position.z -= fireSpeed;
            
            // Light follows fire wall
            scene.children.forEach(c => {
                if(c.type === "PointLight") {
                    c.position.z = fireWall.position.z - 3;
                }
            });

            // Player lateral movement
            if (keys.left) player.position.x -= 0.3;
            if (keys.right) player.position.x += 0.3;
            
            // Clamp player X to floor bounds
            player.position.x = Math.max(-14, Math.min(14, player.position.x));

            // Camera follows player
            camera.position.x = player.position.x * 0.5; // Slight look-ahead pan
            camera.position.y = 4;
            camera.position.z = player.position.z + 8;
            camera.lookAt(player.position.x, 0, player.position.z - 5);

            // Collision Detection
            const playerBox = new THREE.Box3().setFromObject(player);
            // Shrink player hitbox slightly for forgiveness
            playerBox.expandByScalar(-0.2); 
            
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                let obsBox = new THREE.Box3().setFromObject(obs);
                
                if (playerBox.intersectsBox(obsBox)) {
                    // Hit obstacle! Bounce player back towards fire
                    player.position.z += 3; 
                    
                    // Remove obstacle so we don't get stuck in it
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    
                    // Flash player red briefly (optional polish, skip for now)
                }
                
                // Remove obstacles that are behind the fire wall to save memory
                if (obs.position.z > fireWall.position.z) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // Spawn new obstacles ahead
            if (obstacles.length > 0) {
                let lastObs = obstacles[obstacles.length - 1];
                if (lastObs.position.z > player.position.z - 150) {
                    spawnObstacle(lastObs.position.z - (10 + Math.random() * 15));
                }
            }

            // Check if fire wall caught player
            // Fire wall thickness is 5, so front is at fireWall.position.z - 2.5
            if (fireWall.position.z - 2.5 <= player.position.z) {
                isGameOver = true;
                gameOverElement.style.display = 'block';
            }

            // Update Score (distance traveled)
            score = Math.floor(-player.position.z);
            scoreElement.innerText = `Score: ${score}`;

            // Make fire visually menacing (wobble)
            fireWall.scale.y = 1 + Math.sin(Date.now() * 0.01) * 0.1;
            fireWall.scale.x = 1 + Math.cos(Date.now() * 0.01) * 0.05;

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
