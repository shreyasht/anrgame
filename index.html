<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lava Bed Defense</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #333;
            color: white;
            font-family: sans-serif;
            flex-direction: column;
        }
        canvas {
            background-color: #8B4513; /* Dirt background */
            border: 4px solid #222;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.5);
        }
        #ui {
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="ui">
        <h2>Lava Bed Defense</h2>
        <p>Use <b>Arrow Keys / WASD</b> to move the Boy.</p>
        <p>Press <b>Spacebar</b> to place a protective block.</p>
        <p>Don't let the lava reach your bed!</p>
        <h3 id="score">Score: 0</h3>
        <h3 id="gameOver" style="display: none; color: #ff4444;">GAME OVER! Press R to Restart</h3>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');

        const TILE_SIZE = 30;
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        let grid = [];
        let boy = { x: 10, y: 10 };
        let bed = { x: 10, y: 10, w: 2, h: 3 };
        let coin = { x: -1, y: -1 };
        let slimes = [];
        let score = 0;
        let isGameOver = false;
        
        let lavaTimer = 0;
        const LAVA_SPEED = 30; // Frames between lava spread
        
        let slimeMoveTimer = 0;
        const SLIME_SPEED = 40; // Frames between slime movement
        
        let slimeSpawnTimer = 0;
        const SLIME_SPAWN_RATE = 150; // Frames between slime spawns

        // 0 = empty, 1 = bed, 2 = lava, 3 = wall

        function initGame() {
            grid = Array(COLS).fill().map(() => Array(ROWS).fill(0));
            slimes = [];
            
            // Place bed in center
            bed.x = Math.floor(COLS / 2) - 1;
            bed.y = Math.floor(ROWS / 2) - 1;
            
            for(let i = 0; i < bed.w; i++) {
                for(let j = 0; j < bed.h; j++) {
                    grid[bed.x + i][bed.y + j] = 1;
                }
            }

            // Place boy near bed
            boy.x = bed.x - 2;
            boy.y = bed.y;

            score = 0;
            isGameOver = false;
            lavaTimer = 0;
            slimeMoveTimer = 0;
            slimeSpawnTimer = 0;
            gameOverElement.style.display = 'none';
            
            spawnLava();
            spawnCoin();
            
            updateScore();
            gameLoop();
        }

        function spawnLava() {
            const edges = [
                {x: 0, y: Math.floor(Math.random() * ROWS)},
                {x: COLS-1, y: Math.floor(Math.random() * ROWS)},
                {x: Math.floor(Math.random() * COLS), y: 0},
                {x: Math.floor(Math.random() * COLS), y: ROWS-1}
            ];
            const start = edges[Math.floor(Math.random() * edges.length)];
            grid[start.x][start.y] = 2;
        }

        function spawnCoin() {
            let placed = false;
            while (!placed) {
                let cx = Math.floor(Math.random() * COLS);
                let cy = Math.floor(Math.random() * ROWS);
                if (grid[cx][cy] === 0) {
                    coin.x = cx;
                    coin.y = cy;
                    placed = true;
                }
            }
        }

        function spawnSlime() {
            // Find all lava tiles
            let lavaTiles = [];
            for (let x = 0; x < COLS; x++) {
                for (let y = 0; y < ROWS; y++) {
                    if (grid[x][y] === 2) lavaTiles.push({x, y});
                }
            }
            if (lavaTiles.length > 0) {
                let spawnPt = lavaTiles[Math.floor(Math.random() * lavaTiles.length)];
                slimes.push({x: spawnPt.x, y: spawnPt.y});
            }
        }

        function spreadLava() {
            let newLava = [];
            for (let x = 0; x < COLS; x++) {
                for (let y = 0; y < ROWS; y++) {
                    if (grid[x][y] === 2) {
                        const neighbors = [
                            {dx: 1, dy: 0}, {dx: -1, dy: 0},
                            {dx: 0, dy: 1}, {dx: 0, dy: -1}
                        ];
                        neighbors.forEach(n => {
                            const nx = x + n.dx;
                            const ny = y + n.dy;
                            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                                if (grid[nx][ny] === 0) {
                                    newLava.push({x: nx, y: ny});
                                } else if (grid[nx][ny] === 1) {
                                    isGameOver = true;
                                }
                            }
                        });
                    }
                }
            }
            
            newLava.forEach(l => {
                if(Math.random() > 0.4) { 
                    grid[l.x][l.y] = 2;
                    if (l.x === coin.x && l.y === coin.y) {
                        spawnCoin();
                    }
                }
            });
        }

        function moveSlimes() {
            for (let s of slimes) {
                // Move towards boy
                let dx = boy.x - s.x;
                let dy = boy.y - s.y;
                
                let nx = s.x;
                let ny = s.y;

                if (Math.abs(dx) > Math.abs(dy)) {
                    nx += Math.sign(dx);
                } else {
                    ny += Math.sign(dy);
                }

                // If path is blocked, try the other direction
                if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS || grid[nx][ny] === 1 || grid[nx][ny] === 3) {
                    nx = s.x;
                    ny = s.y;
                    if (Math.abs(dx) <= Math.abs(dy) && dx !== 0) {
                        nx += Math.sign(dx);
                    } else if (dy !== 0) {
                        ny += Math.sign(dy);
                    }
                }

                if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && grid[nx][ny] !== 1 && grid[nx][ny] !== 3) {
                    s.x = nx;
                    s.y = ny;
                }

                // Check collision with boy
                if (s.x === boy.x && s.y === boy.y) {
                    isGameOver = true;
                }
            }
        }

        function updateScore() {
            scoreElement.innerText = `Score (Collect Gold!): ${score}`;
        }

        function drawEmoji(emoji, x, y, size) {
            ctx.font = `${size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid and objects
            for (let x = 0; x < COLS; x++) {
                for (let y = 0; y < ROWS; y++) {
                    if (grid[x][y] === 1) {
                        // Bed 
                        ctx.fillStyle = '#ff69b4';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    } else if (grid[x][y] === 2) {
                        // Lava
                        drawEmoji('🔥', x, y, 22);
                    } else if (grid[x][y] === 3) {
                        // Wall
                        ctx.fillStyle = '#808080';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        drawEmoji('🧱', x, y, 20);
                    }
                }
            }
            
            // Draw one big bed emoji over the bed area
            ctx.font = '50px sans-serif';
            ctx.fillText('🛏️', bed.x * TILE_SIZE + TILE_SIZE, bed.y * TILE_SIZE + TILE_SIZE * 1.5);

            // Draw Coin
            if (coin.x !== -1) {
                drawEmoji('🪙', coin.x, coin.y, 24);
            }

            // Draw Slimes
            for (let s of slimes) {
                drawEmoji('👺', s.x, s.y, 24);
            }

            // Draw Boy
            drawEmoji('👦', boy.x, boy.y, 26);
        }

        function gameLoop() {
            if (isGameOver) {
                draw();
                gameOverElement.style.display = 'block';
                return;
            }

            lavaTimer++;
            if (lavaTimer >= LAVA_SPEED) {
                spreadLava();
                if (Math.random() < 0.2) spawnLava();
                lavaTimer = 0;
            }
            
            slimeSpawnTimer++;
            if (slimeSpawnTimer >= SLIME_SPAWN_RATE) {
                spawnSlime();
                slimeSpawnTimer = 0;
            }

            slimeMoveTimer++;
            if (slimeMoveTimer >= SLIME_SPEED) {
                moveSlimes();
                slimeMoveTimer = 0;
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', (e) => {
            if(isGameOver && (e.key === 'r' || e.key === 'R')) {
                initGame();
                return;
            }
            if(isGameOver) return;

            let nx = boy.x;
            let ny = boy.y;

            if (e.key === 'ArrowUp' || e.key === 'w') ny--;
            if (e.key === 'ArrowDown' || e.key === 's') ny++;
            if (e.key === 'ArrowLeft' || e.key === 'a') nx--;
            if (e.key === 'ArrowRight' || e.key === 'd') nx++;

            // Move boy
            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                if (grid[nx][ny] !== 3) { // Can't walk through walls
                    boy.x = nx;
                    boy.y = ny;

                    if(grid[nx][ny] === 2) {
                        isGameOver = true;
                    }
                    
                    // Check slime collision immediately on move
                    for(let s of slimes) {
                        if (s.x === boy.x && s.y === boy.y) isGameOver = true;
                    }
                    
                    if (boy.x === coin.x && boy.y === coin.y) {
                        score += 10;
                        updateScore();
                        spawnCoin();
                    }
                }
            }

            // Place wall
            if (e.key === ' ') {
                if (grid[boy.x][boy.y] === 0) {
                    grid[boy.x][boy.y] = 3; 
                }
            }
        });

        initGame();
    </script>
</body>
</html>
